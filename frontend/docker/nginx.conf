server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Laravel API + Sanctum endpoints → PHP-FPM in the `api` container
    location ~ ^/(api|sanctum)(/|$) {
        rewrite ^ /index.php last;
    }

    # Laravel health check endpoint
    location = /up {
        rewrite ^ /index.php last;
    }

    # POST /login goes to Laravel, GET /login serves the React login page
    location = /login {
        if ($request_method = POST) {
            rewrite ^ /index.php last;
        }
        try_files /index.html =404;
    }

    # All PHP requests resolve to Laravel's front controller
    # (path lives in the api container, not in this image)
    location ~ \.php$ {
        fastcgi_pass api:9000;

        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $scheme;
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;

        fastcgi_hide_header X-Powered-By;
    }

    # Hashed Vite assets are immutable, cache them forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
